# Coturn TURN server configuration for LAN development
# Bound to Windows host IP 192.168.2.3

listening-port=3478
fingerprint
lt-cred-mech
realm=stream.local
user=streamuser:streampass
no-multicast-peers
log-file=stdout

# Advertise Windows host LAN IP so Docker port-forwarding works
external-ip=192.168.2.3

# Relay port range (must match docker-compose.yml port mapping)
min-port=49152
max-port=49200
